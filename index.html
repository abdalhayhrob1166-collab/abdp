<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحح روابط GitHub Direct Download</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #24292e;
            font-size: 1.25rem;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2da44e;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2c974b;
        }
        .result-box {
            margin-top: 15px;
            display: none;
        }
        .result-box input {
            background-color: #f6f8fa;
            color: #0969da;
        }
        .copy-btn {
            background-color: #0969da;
            margin-top: 5px;
        }
        .copy-btn:hover {
            background-color: #0860ca;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>مصحح روابط GitHub للملفات</h2>
    <input type="text" id="githubUrl" placeholder="ألصق رابط GitHub هنا...">
    <button onclick="convertUrl()">تحويل إلى رابط مباشر</button>

    <div class="result-box" id="resultBox">
        <label>الرابط المباشر الصحيح:</label>
        <input type="text" id="directUrl" readonly>
        <button class="copy-btn" onclick="copyUrl()">نسخ الرابط المباشر</button>
    </div>
</div>

<script>
    function convertUrl() {
        const inputUrl = document.getElementById('githubUrl').value.trim();
        const resultBox = document.getElementById('resultBox');
        const directUrlInput = document.getElementById('directUrl');

        if (!inputUrl) {
            alert('الرجاء أدخل الرابط أولاً');
            return;
        }

        // يستبدل كلمة /blob/ بـ /raw/
        let fixedUrl = inputUrl.replace('/blob/', '/raw/');

        directUrlInput.value = fixedUrl;
        resultBox.style.display = 'block';
    }

    function copyUrl() {
        const directUrlInput = document.getElementById('directUrl');
        directUrlInput.select();
        document.execCommand('copy');
        alert('تم نسخ الرابط المباشر بنجاح!');
    }
</script>

</body>
</html>
